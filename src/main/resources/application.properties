spring.application.name=my-backend-java
server.port=${PORT:8080}

# Spring Boot Docker Compose disable in container
spring.docker.compose.enabled=false

# Database Configuration (Injected via GCP Cloud Run env variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://10.40.16.3:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.cache.cache-names=location,friend-cooldown
spring.data.redis.ssl.enabled=true

# JWT Secret
jwt.secret=${JWT_SECRET}

# Spring Framework Multipart Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Photo Processor Limits
photo.max-pixels=25000000
photo.max-input-bytes=10485760
photo.max-target-bytes=512000
photo.max-long-edge=1024
photo.min-long-edge=320
photo.min-quality=0.4